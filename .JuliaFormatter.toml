# Formatting is mechanical and never discussed in review (STANDARDS.md §9).
# 92 columns matches the margin the existing source was written to.
style = "default"
margin = 92
indent = 4
always_for_in = true
whitespace_typedefs = false
whitespace_ops_in_indices = false
remove_extra_newlines = true
trailing_comma = false
normalize_line_endings = "unix"

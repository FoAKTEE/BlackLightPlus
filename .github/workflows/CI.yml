name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: Julia ${{ matrix.version }} (${{ matrix.env }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          # The committed Manifest.toml pins the reproducible environment and
          # was resolved on 1.12; instantiating it on an older Julia pins
          # versions that cannot precompile there. So test the lower bound by
          # resolving fresh against the compat bounds, and test the pinned
          # environment on the version it was resolved for.
          - version: '1.10'
            env: compat bounds
            use_manifest: false
            os: ubuntu-latest
          - version: '1.12'
            env: pinned manifest
            use_manifest: true
            os: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
          arch: x64

      - uses: julia-actions/cache@v2

      - name: Resolve fresh against compat bounds
        if: ${{ !matrix.use_manifest }}
        run: rm -f Manifest.toml

      - uses: julia-actions/julia-buildpkg@v1

      # No GPU and no simulation data on CI; those blocks skip themselves.
      # Run Pkg.test directly rather than via julia-actions/julia-runtest so a
      # failure can be surfaced as a job annotation: annotations are readable
      # without a token, full job logs are not.
      - name: Run tests
        env:
          BLP_SKIP_GPU: '1'
        run: |
          set -o pipefail +e
          julia --project=. --color=yes -e 'using Pkg; Pkg.test(coverage=true)' 2>&1 | tee test.log
          code=$?
          if [ $code -ne 0 ]; then
            digest=$(grep -aE "Test Failed|Error During Test|Got exception|Expression:|Evaluated:|Stacktrace|did not pass|^ERROR|Killed|out of memory|No space left" test.log \
                     | cut -c1-220 | head -40)
            enc=$(printf '%s' "$digest" | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            echo "::error title=Test failure digest (${{ matrix.version }})::$enc"
          fi
          exit $code

      - uses: julia-actions/julia-processcoverage@v1
        if: ${{ matrix.use_manifest }}

      - uses: codecov/codecov-action@v4
        if: ${{ matrix.use_manifest }}
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
        continue-on-error: true

name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: Julia ${{ matrix.version }} (${{ matrix.env }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          # The committed Manifest.toml pins the reproducible environment and
          # was resolved on 1.12; instantiating it on an older Julia pins
          # versions that cannot precompile there. So test the lower bound by
          # resolving fresh against the compat bounds, and test the pinned
          # environment on the version it was resolved for.
          - version: '1.10'
            env: compat bounds
            use_manifest: false
            os: ubuntu-latest
          - version: '1.12'
            env: pinned manifest
            use_manifest: true
            os: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
          arch: x64

      - uses: julia-actions/cache@v2

      - name: Resolve fresh against compat bounds
        if: ${{ !matrix.use_manifest }}
        run: rm -f Manifest.toml

      - uses: julia-actions/julia-buildpkg@v1

      # No GPU and no simulation data on CI; those blocks skip themselves.
      - uses: julia-actions/julia-runtest@v1
        env:
          BLP_SKIP_GPU: '1'

      - uses: julia-actions/julia-processcoverage@v1
        if: ${{ matrix.use_manifest }}

      - uses: codecov/codecov-action@v4
        if: ${{ matrix.use_manifest }}
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
        continue-on-error: true
